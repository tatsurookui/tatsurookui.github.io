<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — home">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span class="brand-name">{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        {% assign nav_pages = site.pages | sort: "nav_order" %}
        {% for item in nav_pages %}
          {% if item.nav_order %}
            <li>
              <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
            </li>
          {% endif %}
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
